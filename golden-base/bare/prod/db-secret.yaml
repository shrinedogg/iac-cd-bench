# DB connection secret - placeholder-reference pattern.
#
# bare has no SOPS, no Flux, no ExternalSecrets operator: nothing in this
# arm decrypts or fetches a secret value at apply time. So this Secret is
# committed as a stub only - the `password` value below is a literal
# placeholder, never a real credential, and CI/pre-commit should treat any
# non-placeholder value here as a leak. Before `kubectl apply`, an operator
# (or a bootstrap step outside this repo) replaces it out-of-band, e.g.:
#
#   kubectl create secret generic db-password-prod -n infra \
#     --from-literal=password="$(aws secretsmanager get-secret-value ...)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# See golden-base/bare/README.md for the full rationale and the alternative
# (RDS-managed password via Secrets Manager) this pattern was chosen over.
apiVersion: v1
kind: Secret
metadata:
  name: db-password-prod
  namespace: infra
  annotations:
    bare.golden/placeholder: "true"
type: Opaque
stringData:
  password: "REPLACE_OUT_OF_BAND_NEVER_COMMIT_REAL_VALUE"
