title: "Fix SOPS secret referencing wrong age key"
answer_format: code

stages:
  lint:
    enabled: true
    tools:
      - yq
      - kubeconform
  static:
    enabled: true
    tools:
      - kustomize build
  semantic:
    enabled: true
    assertion_count: 2
  e2e:
    enabled: false

defect:
  description: ".sops.yaml's creation_rules reference a placeholder age public key instead of the real one committed in age-key.txt, so SOPS cannot decrypt any *.yaml/*.yml secret and Flux kustomizations that depend on them fail"
  fix: "Set both creation_rules entries' age value in .sops.yaml to the key in age-key.txt (age1mmngvhy2xuyjd49hdmzg0n6fum5l83u38w5npdd6jpwsuey7fy9svrhspg); age-key.txt itself and infra/secret.yaml are not part of this PR"
